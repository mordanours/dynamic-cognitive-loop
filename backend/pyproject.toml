[project]
name = "cognitive-loop-backend"
version = "0.1.0"
description = "Dynamic Cognitive Loop (Agentic PKM) - Phase 1 MVP Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "openai>=1.55.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "jsonschema>=4.23.0",
    "httpx>=0.27.0",
    "apscheduler>=3.10.4",
    "pyjwt>=2.9.0",
    "cryptography>=43.0.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.2",
    "python-multipart>=0.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
